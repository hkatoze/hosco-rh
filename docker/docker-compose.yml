# Compose de développement : base de données + client web d'administration.
# En dev, server/ et web/ tournent en dehors de Docker (npm run dev).
# Pour la production (app + Caddy inclus), voir docker-compose.prod.yml.

services:
  postgres:
    image: postgres:16
    container_name: hosco-personnel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hosco}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hosco}
      POSTGRES_DB: ${POSTGRES_DB:-hosco_personnel}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hosco} -d ${POSTGRES_DB:-hosco_personnel}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:4
    container_name: hosco-personnel-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
